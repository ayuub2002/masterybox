<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masterybox QR Poster</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif;text-align:center;padding:28px 14px}.poster{max-width:560px;margin:20px auto;background:#151d32;border:1px solid #f3c76b55;border-radius:20px;padding:30px}h1{color:#f3c76b;font-size:34px}p{color:#cbd5e1;line-height:1.6}input{width:100%;padding:13px;border-radius:8px;border:0;margin:12px 0}button{padding:12px 18px;background:#f3c76b;border:0;border-radius:8px;font-weight:bold;margin:5px;cursor:pointer}#qr{background:white;width:max-content;margin:22px auto;padding:12px;border-radius:8px}#status{font-size:13px}</style></head>
<body><div class="poster"><p style="letter-spacing:4px;color:#f3c76b">MASTERYBOX</p><h1>TRY YOUR LUCK!</h1><p>Scan the QR code. Open your mystery box.<br>Discover your surprise product and price.</p><label for="url">Published customer page URL</label><input id="url" type="url" placeholder="https://your-site.example"><button id="make">Generate QR Code</button><div id="qr"></div><p id="status">Enter your published customer page URL.</p><button id="download">Download QR PNG</button><button onclick="window.print()">Print poster</button></div>
<script>
const input=document.getElementById("url"),qr=document.getElementById("qr"),status=document.getElementById("status");
document.getElementById("make").onclick=()=>{const value=input.value.trim();let parsed;try{parsed=new URL(value)}catch{status.textContent="Enter a valid website URL.";return}if(!["https:","http:"].includes(parsed.protocol)||["localhost","127.0.0.1"].includes(parsed.hostname)){status.textContent="Use your published website URL, not localhost.";return}if(typeof QRCode==="undefined"){status.textContent="QR library did not load. Check your internet connection.";return}qr.innerHTML="";new QRCode(qr,{text:value,width:260,height:260,correctLevel:QRCode.CorrectLevel.H});status.textContent="QR code generated. Scan it to test."};
document.getElementById("download").onclick=()=>{const canvas=qr.querySelector("canvas");if(!canvas){status.textContent="Generate a QR code first.";return}const a=document.createElement("a");a.download="masterybox-customer-qr.png";a.href=canvas.toDataURL("image/png");a.click()};
</script></body></html>
